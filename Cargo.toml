[workspace]
resolver = "2"
members = ["crates/mf-core", "crates/mf-runtime", "crates/mf-server", "crates/mf-cli", "crates/mf-python"]

[workspace.package]
edition = "2021"
version = "0.24.0"
license = "Apache-2.0"
repository = "https://github.com/secke/model-flow"
authors = ["secke"]
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# Pricing and validation engine, cross-checked against QuantLib (pinned for reproducibility).
quantparity = { git = "https://github.com/secke/quantparity", rev = "7f8d337f7d5cbd86b5bed5391cd17979813415d0" }

# The reference engine's simulations and fits run optimized in debug builds and tests too.
[profile.dev.package.quantparity]
opt-level = 3
