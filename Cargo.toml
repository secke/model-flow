[workspace]
resolver = "2"
members = ["crates/mf-core", "crates/mf-validate", "crates/mf-pricing", "crates/mf-runtime", "crates/mf-server", "crates/mf-cli"]

[workspace.package]
edition = "2021"
version = "0.8.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
