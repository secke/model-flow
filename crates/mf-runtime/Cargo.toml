[package]
name = "mf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ModelFlow runtime: TOML pipelines, built-in validation steps, isolated external models, run store, HTML report."
publish = false

[dependencies]
mf-core = { path = "../mf-core" }
quantparity.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rusqlite.workspace = true
libc = "0.2"
csv = "1"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
r2d2 = "0.8"
r2d2_postgres = "0.18"
parquet = { version = "53", default-features = false, features = ["snap", "zstd", "flate2"] }
