# The eight models of experiment 06 on the same days (from return 750), with the ES backtest's Z2
# zones read from p-values simulated from each model's own forecast distribution (100,000 samples)
# instead of the fixed thresholds -0.70 and -1.8.
name = "sp500-garch-z2-simulated"

[[step]]
name = "returns"
kind = "csv"
version = "1.0.0"
path = "../01-sp500-var-backtest/data/returns.csv"
column = "ret"

[[step]]
name = "days"
kind = "csv"
version = "1.0.0"
path = "../01-sp500-var-backtest/data/returns.csv"
column = "day"

# Champion of experiment 01: RiskMetrics, normal quantile
[[step]]
name = "ewma_normal"
kind = "var_model"
version = "1.0.0"
deps = ["returns"]
params = { volatility = "ewma", distribution = "normal", lambda = 0.94, warmup = 30, alpha = 0.99, es_alpha = 0.975 }

[[step]]
name = "var_ewma_normal"
kind = "backtest_forecasts"
version = "1.0.0"
deps = ["returns", "ewma_normal", "days"]
params = { alpha = 0.99, returns = "returns", forecasts = "ewma_normal", dates = "days", from = 750 }

[[step]]
name = "es_ewma_normal"
kind = "es_backtest"
version = "1.0.0"
deps = ["returns", "ewma_normal", "days"]
params = { simulations = 100000, seed = 1, returns = "returns", forecasts = "ewma_normal", dates = "days", from = 750 }

# Best challenger of experiment 05: EWMA filtered historical simulation
[[step]]
name = "ewma_fhs"
kind = "var_model"
version = "1.0.0"
deps = ["returns"]
params = { volatility = "ewma", distribution = "fhs", lambda = 0.94, warmup = 30, min_residuals = 250, alpha = 0.99, es_alpha = 0.975 }

[[step]]
name = "var_ewma_fhs"
kind = "backtest_forecasts"
version = "1.0.0"
deps = ["returns", "ewma_fhs", "days"]
params = { alpha = 0.99, returns = "returns", forecasts = "ewma_fhs", dates = "days", from = 750 }

[[step]]
name = "es_ewma_fhs"
kind = "es_backtest"
version = "1.0.0"
deps = ["returns", "ewma_fhs", "days"]
params = { simulations = 100000, seed = 1, returns = "returns", forecasts = "ewma_fhs", dates = "days", from = 750 }

# GARCH(1,1), normal quantile
[[step]]
name = "garch_normal"
kind = "var_model"
version = "1.0.0"
deps = ["returns", "days"]
params = { dates = "days", volatility = "garch", distribution = "normal", warmup = 500, refit = 250, alpha = 0.99, es_alpha = 0.975 }

[[step]]
name = "var_garch_normal"
kind = "backtest_forecasts"
version = "1.0.0"
deps = ["returns", "garch_normal", "days"]
