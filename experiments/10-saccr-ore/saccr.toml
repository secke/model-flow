# SA-CCR of the ORE portfolio (four netting sets, 39 trades): recomputed under Basel CRE52 and reconciled with the
# exposures ORE 1.8.17 reports for the same trades.
name = "saccr-ore"

[[step]]
name = "netting_sets"
kind = "json"
version = "1.0.0"
path = "netting_sets.json"

[[step]]
name = "saccr"
kind = "saccr"
version = "1.0.0"
deps = ["netting_sets"]
params = { alpha = 1.4, tolerance = 0.005, abs_tolerance = 1 }
