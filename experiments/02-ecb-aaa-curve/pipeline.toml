# Copied into every data/<date>/ directory by prepare.py: one pipeline, and one replayable run, per date.
name = "ecb-aaa-curve"

# Raw ECB AAA curve for the date: par yields and spot rates, 3 months to 30 years
[[step]]
name = "ecb"
kind = "json"
version = "1.0.0"
path = "ecb.json"

[[step]]
name = "market"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../models/build_market.py"]
code = ["../../models/build_market.py"]

# Bootstrap and re-pricing of the 30 par instruments, for both curves
[[step]]
name = "curve"
kind = "curve_bootstrap"
version = "1.0.0"
deps = ["market"]
params = { curve = "EUR-AAA", tolerance = 1e-12, grid_step = 1.0 }

[[step]]
name = "curve_naive"
kind = "curve_bootstrap"
version = "1.0.0"
deps = ["market"]
params = { curve = "EUR-AAA-NAIVE", tolerance = 1e-12, grid_step = 1.0 }

# Control set: 358 zero-coupon bonds and the ECB spot rates as prices
[[step]]
name = "ecb_prices"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../models/checks.py"]
code = ["../../models/checks.py"]
params = { output = "prices" }

[[step]]
name = "zero_coupons"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../models/checks.py"]
code = ["../../models/checks.py"]
params = { output = "trades", curve = "EUR-AAA" }

[[step]]
name = "zero_coupons_naive"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../models/checks.py"]
code = ["../../models/checks.py"]
params = { output = "trades", curve = "EUR-AAA-NAIVE" }

# ECB spot curve vs. the independent reconstruction. Price tolerance on a 100 face:
# 1e-3 is about 0.1 bp of zero rate at 1 year and 0.003 bp at 30 years.
[[step]]
name = "spot_check"
kind = "pricing_benchmark"
version = "1.0.0"
deps = ["zero_coupons", "ecb_prices", "market"]

[step.params]
trades = "zero_coupons"
candidate = "ecb_prices"
market = "market"

[step.params.tolerances]
default = { abs = 1e-3, rel = 0.0 }

[[step]]
name = "spot_check_naive"
kind = "pricing_benchmark"
version = "1.0.0"
deps = ["zero_coupons_naive", "ecb_prices", "market"]

[step.params]
trades = "zero_coupons_naive"
candidate = "ecb_prices"
market = "market"

[step.params.tolerances]
default = { abs = 1e-3, rel = 0.0 }
