# Template copied by ecb_methodology.py into work/<date>/pipeline.toml, first as version 1 of the
# market builder, then as version 2: the change is then compared with `mf diff pipeline.toml`.
name = "ecb-aaa-curve-methodology"

[[step]]
name = "ecb"
kind = "json"
version = "1.0.0"
path = "../../../02-ecb-aaa-curve/data/@DATE@/ecb.json"

[[step]]
name = "market"
kind = "process"
version = "@VERSION@"
deps = ["ecb"]
command = ["python3", "../../models/market.py"]
code = ["../../models/market.py"]
params = { convention = "@CONVENTION@" }

[[step]]
name = "curve"
kind = "curve_bootstrap"
version = "1.0.0"
deps = ["market"]
params = { curve = "EUR-AAA", tolerance = 1e-12, grid_step = 1.0 }

# Control: the ECB spot curve at 358 maturities, as zero-coupon prices (code of experiment 02)
[[step]]
name = "ecb_prices"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../../02-ecb-aaa-curve/models/checks.py"]
code = ["../../../02-ecb-aaa-curve/models/checks.py"]
params = { output = "prices" }

[[step]]
name = "zero_coupons"
kind = "process"
version = "1.0.0"
deps = ["ecb"]
command = ["python3", "../../../02-ecb-aaa-curve/models/checks.py"]
code = ["../../../02-ecb-aaa-curve/models/checks.py"]
params = { output = "trades", curve = "EUR-AAA" }

[[step]]
name = "spot_check"
kind = "pricing_benchmark"
version = "1.0.0"
deps = ["zero_coupons", "ecb_prices", "market"]

[step.params]
trades = "zero_coupons"
candidate = "ecb_prices"
market = "market"

[step.params.tolerances]
default = { abs = 1e-3, rel = 0.0 }

# Tolerances for `mf diff`, in basis points of rate, by maturity band (first match wins).
# Below 10 years (a single-digit maturity): 1 bp.
[[tolerance]]
path = "*=?]*rate"
bp = 1.0

[[tolerance]]
path = "*=?.0]*rate"
bp = 1.0

[[tolerance]]
path = "*=?.0]*quote"
bp = 1.0

# 10 years and beyond: 0.5 bp.
[[tolerance]]
path = "*rate"
bp = 0.5

[[tolerance]]
path = "*quote"
bp = 0.5

# Discount factors are redundant with zero rates (DF = exp(-r t)) and a relative tolerance on them
# is not consistent across maturities (dDF/DF = -t dr: 0.5 bp is 1.5e-4 at 30 years, 5e-5 at 1 year).
[[tolerance]]
path = "curve.*discount_factor"
ignore = true

# Numerical residuals of the bootstrap, already checked by the curve step itself.
[[tolerance]]
path = "curve.*repricing_error"
abs = 1e-10

[[tolerance]]
path = "curve.max_repricing_error"
abs = 1e-10

# Per-trade benchmark details: the curve is compared directly above, the verdict below.
[[tolerance]]
path = "spot_check.trades*"
ignore = true

[[tolerance]]
path = "spot_check.*diff"
ignore = true
