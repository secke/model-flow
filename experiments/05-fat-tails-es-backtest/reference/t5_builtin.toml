# The same challenger as the built-in `var_model` step, with an exact Student-t quantile
name = "t5-builtin"

[[step]]
name = "returns"
kind = "csv"
version = "1.0.0"
path = "../../01-sp500-var-backtest/data/returns.csv"
column = "ret"

[[step]]
name = "model"
kind = "var_model"
version = "1.0.0"
deps = ["returns"]
params = { distribution = "t", nu = 5, lambda = 0.94, alpha = 0.99, warmup = 30 }

[[tolerance]]             # the external model reads its quantile from a 6-decimal table (gap 3.2e-10)
path = "model.var[*]"
rel = 1e-9

[[tolerance]]
path = "model.*"
ignore = true
