name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MODELFLOW_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install QuantLib==1.44
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Exemples de bout en bout
        run: |
          cargo build --release
          for e in var-equity pd-scorecard pricing-benchmark rates-benchmark multicurve-benchmark; do
            p=examples/$e/pipeline.toml
            target/release/mf run "$p"
            target/release/mf verify "$p"
            target/release/mf report "$p" -o "report-$e.html"
          done
      - name: Historique de la CLI dans PostgreSQL
        env:
          MODELFLOW_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          rm -rf examples/pd-scorecard/.modelflow
          target/release/mf run examples/pd-scorecard/pipeline.toml
          target/release/mf verify examples/pd-scorecard/pipeline.toml
          test ! -e examples/pd-scorecard/.modelflow/runs.db || (echo "SQLite utilisé au lieu de PostgreSQL" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: rapports-validation
          path: report-*.html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t modelflow:0.9.0 .
      - name: Essai de bout en bout dans le conteneur (lecture seule, sans privilèges)
        run: |
          set -euo pipefail
          TOKEN=$(docker run --rm modelflow:0.9.0 new-token | sed -n 's/.*: //p' | head -1)
          HASH=$(docker run --rm modelflow:0.9.0 hash-token "$TOKEN")
          mkdir -p ci-cfg
          printf 'workspace = "/workspace"\nbind = "0.0.0.0:8080"\n[[user]]\nname = "ci"\nrole = "admin"\ntoken_sha256 = "%s"\n' "$HASH" > ci-cfg/server.toml
          docker run -d --name mf -p 8080:8080 --user "$(id -u):$(id -g)" --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/examples:/workspace" -v "$PWD/ci-cfg/server.toml:/etc/modelflow/server.toml:ro" modelflow:0.9.0
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          for p in multicurve-swap-benchmark pricing-library-benchmark; do
            curl -fs -X POST -H "Authorization: Bearer $TOKEN" "localhost:8080/api/pipelines/$p/runs?wait=true" | tee run.json
            grep -q '"status":"pass"' run.json
          done
          docker logs mf
      - name: Validation des manifestes Kubernetes
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-filename-pattern kustomization.yaml deploy/k8s/

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cargo build --release -p mf-server
      - name: Playwright
        run: |
          npm install --no-save --prefix ui-tests playwright@1.63.0
          npx --prefix ui-tests playwright install --with-deps chromium
      - name: Interface de bout en bout (SSO PKCE, propriétaire, validateur, auditeur)
        run: NODE_PATH=ui-tests/node_modules node ui-tests/e2e.cjs target/release/mf-server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-interface
          path: ui-tests/screenshots/
