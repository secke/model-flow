name = "rates-library-benchmark"

[[step]]
name = "market"
kind = "json"
version = "2026-01-15"
path = "market.json"

[[step]]
name = "trades"
kind = "json"
version = "1.0.0"
path = "trades.json"

# Courbe EUR 6M : re-pricing des dépôts et swaps d'entrée
[[step]]
name = "curve_eur_6m"
kind = "curve_bootstrap"
version = "1.0.0"
deps = ["market"]
params = { curve = "EUR-6M", tolerance = 1e-12, grid_step = 1.0 }

# Valorisation de référence (NPV, taux par, DV01)
[[step]]
name = "reference_valuation"
kind = "price_portfolio"
version = "1.0.0"
deps = ["trades", "market"]
params = { trades = "trades", market = "market" }

# Pricer de production à valider : QuantLib
[[step]]
name = "quantlib"
kind = "process"
version = "1.44.0"
deps = ["trades", "market"]
command = ["python3", "models/quantlib_rates.py"]
code = ["models/quantlib_rates.py"]
timeout_secs = 120

[[step]]
name = "benchmark_quantlib"
kind = "pricing_benchmark"
version = "1.0.0"
deps = ["trades", "quantlib", "reference_valuation"]

[step.params]
trades = "trades"
candidate = "quantlib"
reference = "reference_valuation"

# NPV en devise : 1 centime d'écart admis sur les swaps, 1e-6 sur les zéro-coupons.
[step.params.tolerances]
default = { abs = 1e-8, rel = 1e-9 }
interest_rate_swap = { abs = 0.01, rel = 0.0 }
zero_coupon_bond = { abs = 1e-6, rel = 0.0 }
