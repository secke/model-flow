name = "pd-retail-scorecard"

[[step]]
name = "development"
kind = "csv"
version = "1.0.0"
path = "data/development.csv"
columns = ["grade", "pd", "default"]

[[step]]
name = "current"
kind = "csv"
version = "1.0.0"
path = "data/current.csv"
columns = ["grade", "pd", "default"]

# Data quality of the current portfolio before validation: complete, valid grades, PDs and flags
[[step]]
name = "data_quality"
kind = "data_quality"
version = "1.0.0"
path = "data/current.csv"
params = { min_rows = 1000 }

[[step.rule]]
columns = ["grade", "pd", "default"]
required = true
numeric = true

[[step.rule]]
column = "grade"
one_of = [1, 2, 3, 4, 5, 6, 7]

[[step.rule]]
column = "pd"
min = 0.0003
max = 1

[[step.rule]]
column = "default"
one_of = [0, 1]

# Discriminatory power on the current portfolio
[[step]]
name = "discrimination"
kind = "pd_discrimination"
version = "1.0.0"
deps = ["current"]
params = { score = "pd", default = "default", min_gini_pass = 0.40, min_gini_warn = 0.25 }

# Per-grade calibration (binomial) + Hosmer-Lemeshow
[[step]]
name = "calibration"
kind = "pd_calibration"
version = "1.0.0"
deps = ["current"]

# Population stability: development vs. current
[[step]]
name = "stability"
kind = "psi"
version = "1.0.0"
deps = ["development", "current"]
params = { baseline = "development", current = "current", column = "pd", bins = 10 }
