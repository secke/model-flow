name = "pricing-library-benchmark"

[[step]]
name = "trades"
kind = "json"
version = "1.0.0"
path = "trades.json"

# Reference valuation (closed-form formulas, CRR tree) with sensitivities
[[step]]
name = "reference_valuation"
kind = "price_portfolio"
version = "1.0.0"
deps = ["trades"]

# Production pricer under validation: QuantLib
[[step]]
name = "quantlib"
kind = "process"
version = "1.44.0"
deps = ["trades"]
command = ["python3", "models/quantlib_pricer.py"]
code = ["models/quantlib_pricer.py"]
timeout_secs = 120

# Allowed differences per product: abs + rel × |reference price|
[[step]]
name = "benchmark_quantlib"
kind = "pricing_benchmark"
version = "1.0.0"
deps = ["trades", "quantlib", "reference_valuation"]

[step.params]
trades = "trades"
candidate = "quantlib"
reference = "reference_valuation"

[step.params.tolerances]
default = { abs = 1e-8, rel = 1e-8 }
european_option = { abs = 1e-8, rel = 1e-9 }
black76 = { abs = 1e-8, rel = 1e-9 }
# Trees: QuantLib (CRR) uses a log-linearized probability, the reference uses the exact martingale
# probability; the difference is O(Δt) (~5e-5 at 800 steps), not a pricing error.
american_option = { abs = 1e-4, rel = 1e-6 }
fixed_rate_bond = { abs = 1e-8, rel = 1e-9 }
