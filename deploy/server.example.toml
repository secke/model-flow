# ModelFlow server configuration.
# Generate a token: `mf-server new-token`. Give the token to the user
# and only keep its SHA-256 fingerprint here.

# Directory containing one subdirectory per pipeline (<dir>/pipeline.toml), relative to this file.
workspace = "../examples"
bind = "127.0.0.1:8080"

[[user]]
name = "alice"
role = "model_owner"      # triggers runs
token_sha256 = "replace-with-the-token-fingerprint-0000000000000000000000000000"

[[user]]
name = "bob"
role = "validator"        # replays, approves or rejects (never their own runs)
token_sha256 = "replace-with-the-token-fingerprint-0000000000000000000000000000"

[[user]]
name = "carol"
role = "auditor"          # read-only access and audit log
token_sha256 = "replace-with-the-token-fingerprint-0000000000000000000000000000"
