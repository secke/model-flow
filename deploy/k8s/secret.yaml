# Server configuration. It only contains the SHA-256 fingerprints of the tokens; still store it
# as a Secret (or via a secrets manager) and generate it outside the repository.
apiVersion: v1
kind: Secret
metadata:
  name: modelflow-config
  namespace: modelflow
type: Opaque
stringData:
  server.toml: |
    workspace = "/workspace"
    bind = "0.0.0.0:8080"
    max_concurrent_runs = 2
    rate_limit_per_minute = 120

    # Shared database: the URL (with password) is read from the container environment.
    [database]
    url_env = "MODELFLOW_DATABASE_URL"
    max_connections = 10

    # Single sign-on: Entra ID example (adapt issuer, audience and groups).
    [oidc]
    issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
    audience = "api://modelflow"
    username_claim = "preferred_username"
    roles_claim = "roles"
    [oidc.role_mapping]
    "ModelFlow.Owners" = "model_owner"
    "ModelFlow.Validators" = "validator"
    "ModelFlow.Auditors" = "auditor"

    # Service account (CI, scheduler): token fingerprint only.
    [[user]]
    name = "ci-pipeline"
    role = "model_owner"
    token_sha256 = "replace-with-the-token-fingerprint-0000000000000000000000000000"
---
apiVersion: v1
kind: Secret
metadata:
  name: modelflow-database
  namespace: modelflow
type: Opaque
stringData:
  url: postgres://modelflow:change-me@postgres.databases.svc:5432/modelflow?sslmode=verify-full
