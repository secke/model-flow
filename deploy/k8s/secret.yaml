# Configuration du serveur. Elle ne contient que les empreintes SHA-256 des jetons ; la stocker
# néanmoins en Secret (ou via un gestionnaire de secrets) et la générer hors du dépôt.
apiVersion: v1
kind: Secret
metadata:
  name: modelflow-config
  namespace: modelflow
type: Opaque
stringData:
  server.toml: |
    workspace = "/workspace"
    bind = "0.0.0.0:8080"
    max_concurrent_runs = 2
    rate_limit_per_minute = 120

    # Base partagée : l'URL (avec mot de passe) est lue dans l'environnement du conteneur.
    [database]
    url_env = "MODELFLOW_DATABASE_URL"
    max_connections = 10

    # Authentification unique : exemple Entra ID (adapter issuer, audience et groupes).
    [oidc]
    issuer = "https://login.microsoftonline.com/<tenant-id>/v2.0"
    audience = "api://modelflow"
    username_claim = "preferred_username"
    roles_claim = "roles"
    [oidc.role_mapping]
    "ModelFlow.Owners" = "model_owner"
    "ModelFlow.Validators" = "validator"
    "ModelFlow.Auditors" = "auditor"

    # Compte de service (CI, planificateur) : empreinte du jeton uniquement.
    [[user]]
    name = "ci-pipeline"
    role = "model_owner"
    token_sha256 = "remplacer-par-l-empreinte-du-jeton-0000000000000000000000000000"
---
apiVersion: v1
kind: Secret
metadata:
  name: modelflow-database
  namespace: modelflow
type: Opaque
stringData:
  url: postgres://modelflow:remplacer@postgres.databases.svc:5432/modelflow?sslmode=verify-full
