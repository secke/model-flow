# Ingress: only from the ingress controller (TLS terminated at the ingress).
# Egress: none — external models run without network access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelflow
  namespace: modelflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: modelflow
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress: []
