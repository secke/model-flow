# Egress to allow when PostgreSQL and SSO are enabled (not included by default in
# kustomization.yaml: add it explicitly). External models share the pod network:
# restrict HTTPS egress to the identity provider's addresses, or use `jwks_file`
# (JWKS provided by configuration) to open nothing to the outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modelflow-egress
  namespace: modelflow
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: modelflow
  policyTypes: [Egress]
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
      ports:
        - port: 5432
    # Identity provider (replace with its address ranges)
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - port: 443
